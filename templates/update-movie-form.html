<form action="{{ url_for('update_movie', user_id=user_id, movie_id=movie.id) }}" method="post" class="row g-3 mt-3">
  <div class="col-md-6">
    <label for="title" class="form-label">Title</label>
    <input type="text" class="form-control" id="title" name="title" value="{{ movie.name }}" required>
  </div>
  <div class="col-md-6">
    <label for="year" class="form-label">Year</label>
    <input type="text" class="form-control" id="year" name="year" value="{{ movie.year }}" placeholder="Year (optional)">
  </div>
  <div class="col-md-6">
    <label for="director" class="form-label">Director</label>
    <input type="text" class="form-control" id="director" name="director" value="{{ movie.director }}" placeholder="Director (optional)">
  </div>
  <div class="col-md-6">
    <label for="poster_url" class="form-label">Poster URL</label>
    <input type="text" class="form-control" id="poster_url" name="poster_url" value="{{ movie.poster_url }}" placeholder="Poster URL (optional)" readonly>
  </div>
  <div class="col-12">
    <button type="submit" class="btn btn-primary">Update</button>
  </div>
</form>
