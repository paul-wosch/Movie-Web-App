{%- extends "base.html" %}
{%- block content %}
<h1 class="mb-4">Users</h1>

<div class="row row-cols-1 row-cols-md-3 g-4 mb-4">
  {%- for user in users %}
    <div class="col">
      <div class="card h-100 shadow-sm">
        <div class="card-body d-flex flex-column">
          <h5 class="card-title">{{ user.name }}</h5>
          <a href="{{ url_for('get_movies', user_id=user.id) }}" class="btn btn-primary mt-auto">View Movies</a>
        </div>
      </div>
    </div>
  {%- endfor %}
</div>

<div class="card shadow-sm">
  <div class="card-body">
    <h5 class="card-title mb-3">Add New User</h5>
    <form action="{{ url_for('create_user') }}" method="post" class="row g-3">
      <div class="col-md-8">
        <input type="text" class="form-control" name="name" placeholder="User name" required>
      </div>
      <div class="col-md-4">
        <button type="submit" class="btn btn-primary w-100">Add User</button>
      </div>
    </form>
  </div>
</div>
{%- endblock %}
